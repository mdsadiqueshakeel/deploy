version: '3.8'

services:
  api-gateway:
    build: 
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: mlm-api-gateway
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - API_GATEWAY_PORT=5000
      - USER_SERVICE_URL=http://user-service:5001
      - ADMIN_SERVICE_URL=http://admin-service:5002
      - JWT_SECRET=SuperSecretKey
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://api-gateway:5000,http://user-service:5001,http://admin-service:5002
    depends_on:
      - user-service
      - admin-service
    restart: always

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: mlm-user-service
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGO_URI=mongodb+srv://AffilateProduction:Ranjan123@affilateproduction.thjqoek.mongodb.net/MLM_DB?retryWrites=true&w=majority&appName=AffilateProduction
      - JWT_SECRET=SuperSecretKey
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://api-gateway:5000,http://user-service:5001,http://admin-service:5002
      - USER_SERVICE_URL=http://user-service:5001
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=mlmdevelopment001@gmail.com
      - EMAIL_PASS=klteycriqmucjban
      - EMAIL_FROM=mlmdevelopment001@gmail.com
      - CLIENT_URL=http://localhost:3000
    restart: always

  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    container_name: mlm-admin-service
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - MONGO_URI=mongodb+srv://AffilateProduction:Ranjan123@affilateproduction.thjqoek.mongodb.net/MLM_DB?retryWrites=true&w=majority&appName=AffilateProduction
      - JWT_SECRET=SuperSecretKey
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://api-gateway:5000,http://user-service:5001,http://admin-service:5002
      - USER_SERVICE_URL=http://user-service:5001
    depends_on:
      - user-service
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlm-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - api-gateway
    restart: always