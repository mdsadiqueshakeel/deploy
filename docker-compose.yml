services:
  api-gateway:
    build: 
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: mlm-api-gateway
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - API_GATEWAY_PORT=5000
      - USER_SERVICE_URL=http://user-service:5001
      - ADMIN_SERVICE_URL=http://admin-service:5002
      - WALLET_SERVICE_URL=http://wallet-service:5003
      - INCOME_SERVICE_URL=http://income-service:5004
      - JWT_SECRET=SuperSecretKey
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://api-gateway:5000,http://user-service:5001,http://admin-service:5002,http://wallet-service:5003,http://income-service:5004
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    depends_on:
      - user-service
      - admin-service
      - wallet-service
      - income-service
    restart: always

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: mlm-user-service
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - MONGO_URI=mongodb+srv://mlmdevelopment001:NconnectionN@affilateproject.oilsuaa.mongodb.net/?retryWrites=true&w=majority&appName=AffilateProject
      - JWT_SECRET=SuperSecretKey
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://api-gateway:5000,http://user-service:5001,http://admin-service:5002
      - USER_SERVICE_URL=http://user-service:5001
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=mlmdevelopment001@gmail.com
      - EMAIL_PASS=klteycriqmucjban
      - EMAIL_FROM=mlmdevelopment001@gmail.com
      - CLIENT_URL=http://localhost:3000
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    restart: always

  admin-service:
    build:
      context: ./backend/admin-service
      dockerfile: Dockerfile
    container_name: mlm-admin-service
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=development
      - PORT=5002
      - MONGO_URI=mongodb+srv://mlmdevelopment001:NconnectionN@affilateproject.oilsuaa.mongodb.net/?retryWrites=true&w=majority&appName=AffilateProject
      - JWT_SECRET=SuperSecretKey
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://api-gateway:5000,http://user-service:5001,http://admin-service:5002
      - USER_SERVICE_URL=http://user-service:5001
    volumes:
      - ./backend/admin-service:/app
      - /app/node_modules
    depends_on:
      - user-service
    restart: always

  wallet-service:
    build:
      context: ./backend/wallet-service
      dockerfile: Dockerfile
    container_name: mlm-wallet-service
    ports:
      - "5003:5003"
    environment:
      - NODE_ENV=development
      - PORT=5003
      - MONGO_URI=mongodb+srv://mlmdevelopment001:NconnectionN@affilateproject.oilsuaa.mongodb.net/?retryWrites=true&w=majority&appName=AffilateProject
      - JWT_SECRET=SuperSecretKey
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://api-gateway:5000,http://user-service:5001,http://admin-service:5002
      - USER_SERVICE_URL=http://user-service:5001
      - INCOME_SERVICE_URL=http://income-service:5004
    volumes:
      - ./backend/wallet-service:/app
      - /app/node_modules
    depends_on:
      - user-service
    restart: always

  income-service:
    build:
      context: ./backend/income-service
      dockerfile: Dockerfile
    container_name: mlm-income-service
    ports:
      - "5004:5004"
    environment:
      - NODE_ENV=development
      - PORT=5004
      - MONGO_URI=mongodb+srv://mlmdevelopment001:NconnectionN@affilateproject.oilsuaa.mongodb.net/?retryWrites=true&w=majority&appName=AffilateProject
      - JWT_SECRET=SuperSecretKey
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000,http://api-gateway:5000,http://user-service:5001,http://admin-service:5002
      - USER_SERVICE_URL=http://user-service:5001
      - WALLET_SERVICE_URL=http://wallet-service:5003
    volumes:
      - ./backend/income-service:/app
      - /app/node_modules
    depends_on:
      - user-service
      - wallet-service
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlm-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway
    restart: always
  